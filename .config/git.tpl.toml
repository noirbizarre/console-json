# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"

[answers]
author = "Axel Haustant"
categories = "command-line-interface"
copyright_holder = "Axel Haustant"
copyright_year = 2026
crate = "console-json"
description = "A lightweight, terminal-aware JSON pretty printer for Rust, built on console-rs and Serde."
docs = false
gh_ship_token_mode = "app"
keywords = "console, json, colors"
kind = "library"
mbx = true
msrv = true
msrv_version = "1.88"
owner = "noirbizarre"
publish = true
